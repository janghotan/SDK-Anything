name: CI

on:
  # Run once per change instead of twice: feature branches are verified through
  # their pull request, while pushes to main are verified directly. Previously
  # `push: [main, feat/*, chore/*]` plus `pull_request: [main]` created two
  # identical runs for every push to a feature branch with an open PR.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Node ${{ matrix.node-version }} - Quality Gates & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm run format

      - name: TypeScript Typecheck
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Automated Tests
        run: pnpm test

      - name: Production Build
        run: pnpm run build

      - name: Package Distribution Dry-Run
        run: npm pack --dry-run
