<text x="760" y="297" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13.5" font-weight="650" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">list</text>
<rect x="858" y="289" width="52" height="24" rx="12" fill="#DDF2EA" stroke="none" stroke-width="1.5" opacity="1"/><text x="884" y="305" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#1F8A70" text-anchor="middle" letter-spacing="0" opacity="1">read</text>
