<text x="88" y="284" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13" font-weight="600" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">ApiClient</text>
<text x="440" y="284" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="end" letter-spacing="0" opacity="1">类</text>
<rect x="72" y="304" width="384" height="34" rx="8" fill="#EFEBE1" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="88" y="326" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13" font-weight="600" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">create()</text>
<text x="440" y="326" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="end" letter-spacing="0" opacity="1">客户端方法</text>
<rect x="72" y="346" width="384" height="34" rx="8" fill="#EFEBE1" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="88" y="368" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13" font-weight="600" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">list()</text>
<text x="440" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="end" letter-spacing="0" opacity="1">客户端方法</text>
<rect x="72" y="388" width="384" height="34" rx="8" fill="#EFEBE1" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="88" y="410" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13" font-weight="600" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">search()</text>
<text x="440" y="410" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="end" letter-spacing="0" opacity="1">客户端方法</text>
<rect x="72" y="430" width="384" height="34" rx="8" fill="#EFEBE1" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="88" y="452" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13" font-weight="600" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">remove()</text>
<text x="440" y="452" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="end" letter-spacing="0" opacity="1">客户端方法</text>
<text x="72" y="488" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="72" dy="0">类型与 JSDoc 描述了 API，但副作用、密钥处理与结果边界并未表</tspan><tspan x="72" dy="19">达为智能体策略。</tspan></text>
<path d="M 486 300 L 714 300" stroke="#18B6D9" stroke-width="3" stroke-opacity="1" fill="none" marker-end="url(#arrowCyan)"/>
<text x="600" y="272" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="16" font-weight="650" fill="#0B1220" text-anchor="middle" letter-spacing="0" opacity="1">静态分析</text>
<text x="600" y="292" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="middle" letter-spacing="0" opacity="1">可复核证据</text>
