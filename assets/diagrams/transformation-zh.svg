<text x="520" y="412" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" fill="#5B4CD6" text-anchor="start" letter-spacing="0" opacity="1">诊断 + 人工覆盖</text>
<circle cx="524" cy="438" r="2.5" fill="#7C6CF0"/>
<text x="534" y="442" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">未解析类型</text>
<circle cx="524" cy="462" r="2.5" fill="#7C6CF0"/>
<text x="534" y="466" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">人工复核覆盖</text>
<circle cx="524" cy="486" r="2.5" fill="#7C6CF0"/>
<text x="534" y="490" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">重新运行审查</text>
<path d="M 480 452 L 504 452" stroke="#7C6CF0" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="1" fill="none" marker-end="url(#arrowViolet)"/>
<path d="M 696 452 L 720 452" stroke="#7C6CF0" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="1" fill="none" marker-end="url(#arrowViolet)"/>
<rect x="720" y="150" width="432" height="390" rx="18" fill="#FFFFFF" stroke="#18B6D9" stroke-width="2" opacity="1"/>
