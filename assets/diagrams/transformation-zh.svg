<rect x="858" y="355" width="62" height="24" rx="12" fill="#F8EBD5" stroke="none" stroke-width="1.5" opacity="1"/><text x="889" y="371" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#A96B12" text-anchor="middle" letter-spacing="0" opacity="1">write</text>
<text x="1112" y="373" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="end" letter-spacing="0" opacity="1">需显式授权</text>
<rect x="744" y="406" width="384" height="54" rx="10" fill="#F7F5EF" stroke="#D9D3C6" stroke-width="1.5" opacity="1"/>
<text x="760" y="429" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13.5" font-weight="650" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">remove</text>
<rect x="858" y="421" width="100" height="24" rx="12" fill="#F7E3E1" stroke="none" stroke-width="1.5" opacity="1"/><text x="908" y="437" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#B3453F" text-anchor="middle" letter-spacing="0" opacity="1">destructive</text>
<text x="1112" y="439" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="end" letter-spacing="0" opacity="1">确认或授权</text>
<text x="744" y="492" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="744" dy="0">在智能体调用之前，强类型输入、副作用标签、env: 引用与结果上限</tspan><tspan x="744" dy="19">都清晰可见。</tspan></text>
