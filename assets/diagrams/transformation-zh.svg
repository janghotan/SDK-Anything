<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">从 SDK 接口到原子能力</title>
<desc id="desc">前后对比图：普通 TypeScript SDK 客户端转化为带强类型输入与 read、write、destructive 副作用标签的原子操作；未解析类型通过诊断与人工覆盖恢复。</desc>
<defs><marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18B6D9"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B1220"/></marker><marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BDB6A7"/></marker><marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C6CF0"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B3453F"/></marker></defs>
<rect width="1200" height="760" fill="#F7F5EF"/>
<text x="48" y="34" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#087F9C" text-anchor="start" letter-spacing="1.8" opacity="1">转化</text><text x="48" y="66" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="31" font-weight="700" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">从 SDK 接口到原子能力</text><text x="48" y="94" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="15.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">目标是可复核的工具面，而不是对所有符号做魔法包装。</text><path d="M 48 112 L 1152 112" stroke="#D9D3C6" stroke-width="1" stroke-opacity="1" fill="none" opacity="1"/>
<rect x="48" y="150" width="432" height="390" rx="18" fill="#FFFFFF" stroke="#D9D3C6" stroke-width="1.5" opacity="1"/>
<text x="72" y="184" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" font-weight="700" fill="#5C6576" text-anchor="start" letter-spacing="1.4" opacity="1">改造前 · 普通 SDK</text>
<text x="72" y="220" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="24" font-weight="700" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">my-sdk</text>
<text x="72" y="242" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">TypeScript 客户端包</text>
