<rect x="744" y="208" width="384" height="54" rx="10" fill="#F7F5EF" stroke="#D9D3C6" stroke-width="1.5" opacity="1"/>
<text x="760" y="231" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13.5" font-weight="650" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">search</text>
