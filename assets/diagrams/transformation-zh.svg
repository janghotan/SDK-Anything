<rect x="300" y="606" width="84" height="30" rx="15" fill="#FFFFFF" stroke="#18B6D9" stroke-width="1.2" opacity="1"/><text x="342" y="625.55" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" font-weight="600" fill="#0B1220" text-anchor="middle" letter-spacing="0" opacity="1">MCP 服务</text>
<rect x="400" y="606" width="54" height="30" rx="15" fill="#FFFFFF" stroke="#18B6D9" stroke-width="1.2" opacity="1"/><text x="427" y="625.55" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" font-weight="600" fill="#0B1220" text-anchor="middle" letter-spacing="0" opacity="1">CLI</text>
<rect x="470" y="606" width="93" height="30" rx="15" fill="#FFFFFF" stroke="#18B6D9" stroke-width="1.2" opacity="1"/><text x="516.5" y="625.55" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" font-weight="600" fill="#0B1220" text-anchor="middle" letter-spacing="0" opacity="1">智能体技能</text>
<text x="48" y="700" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="48" dy="0">复杂或未解析类型会作为诊断暴露；人工覆盖是恢复路径。转化质量取决于 SDK 的类型表面。</tspan></text>
</svg>
