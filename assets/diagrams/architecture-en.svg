<title id="title">One manifest, three agent surfaces</title>
<desc id="desc">Architecture diagram: npm, local, or GitHub SDK sources pass through a safe resolver and static analyzer, then optional AI proposals and human overrides produce one capability manifest that feeds an MCP server, a CLI, and an agent skill.</desc>
