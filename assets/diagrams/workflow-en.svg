<text x="632" y="260" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">manifest + MCP + CLI + skill</text>
<text x="632" y="286" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" fill="#087F9C" text-anchor="start" letter-spacing="0" opacity="1">one manifest, three surfaces</text>
