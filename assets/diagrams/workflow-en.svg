<rect x="72" y="476" width="147" height="26" rx="13" fill="#ECE9FD" stroke="none" stroke-width="1.2" opacity="1"/><text x="145.5" y="493.025" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="11.5" font-weight="600" fill="#5B4CD6" text-anchor="middle" letter-spacing="0" opacity="1">test --trusted-local</text>
