<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Effects are explicit. Execution is bounded.</title>
<desc id="desc">Security diagram: inspection never imports target code or runs lifecycle scripts; pure and read effects are allowed by default, while write, destructive, and unknown effects require explicit authorization; runtime protections include env secret references, redaction, pagination caps, and fail-closed container behavior.</desc>
<defs><marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18B6D9"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B1220"/></marker><marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BDB6A7"/></marker><marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C6CF0"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B3453F"/></marker></defs>
<rect width="1200" height="720" fill="#F7F5EF"/>
<text x="48" y="34" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#087F9C" text-anchor="start" letter-spacing="1.8" opacity="1">SECURITY</text><text x="48" y="66" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="31" font-weight="700" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">Effects are explicit. Execution is bounded.</text><text x="48" y="94" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="15.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">The shared runtime applies the same defaults to generated MCP servers and CLIs.</text><path d="M 48 112 L 1152 112" stroke="#D9D3C6" stroke-width="1" stroke-opacity="1" fill="none" opacity="1"/>
<rect x="48" y="140" width="1104" height="96" rx="16" fill="#FFFFFF" stroke="#D9D3C6" stroke-width="1.5" opacity="1"/>
<text x="72" y="170" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" fill="#087F9C" text-anchor="start" letter-spacing="1.6" opacity="1">STATIC INSPECTION</text>
<rect x="72" y="190" width="128" height="28" rx="14" fill="#DDF4F9" stroke="none" stroke-width="1.2" opacity="1"/><text x="136" y="208.2" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#087F9C" text-anchor="middle" letter-spacing="0" opacity="1">no target import</text>
<rect x="214" y="190" width="151" height="28" rx="14" fill="#DDF4F9" stroke="none" stroke-width="1.2" opacity="1"/><text x="289.5" y="208.2" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#087F9C" text-anchor="middle" letter-spacing="0" opacity="1">no lifecycle scripts</text>
<rect x="379" y="190" width="127" height="28" rx="14" fill="#DDF4F9" stroke="none" stroke-width="1.2" opacity="1"/><text x="442.5" y="208.2" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#087F9C" text-anchor="middle" letter-spacing="0" opacity="1">bounded archives</text>
<rect x="520" y="190" width="114" height="28" rx="14" fill="#DDF4F9" stroke="none" stroke-width="1.2" opacity="1"/><text x="577" y="208.2" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#087F9C" text-anchor="middle" letter-spacing="0" opacity="1">content digest</text>
<text x="48" y="274" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" fill="#5C6576" text-anchor="start" letter-spacing="1.6" opacity="1">EFFECT POLICY</text>
<rect x="48" y="292" width="330" height="212" rx="16" fill="#DDF2EA" stroke="#1F8A70" stroke-width="1.5" opacity="1"/>
<text x="72" y="330" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="17" font-weight="700" fill="#1F8A70" text-anchor="start" letter-spacing="0" opacity="1">Allowed by default</text>
<rect x="72" y="352" width="52" height="24" rx="12" fill="#DDF2EA" stroke="none" stroke-width="1.5" opacity="1"/><text x="98" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#1F8A70" text-anchor="middle" letter-spacing="0" opacity="1">pure</text>
<rect x="134" y="352" width="52" height="24" rx="12" fill="#DDF2EA" stroke="none" stroke-width="1.5" opacity="1"/><text x="160" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#1F8A70" text-anchor="middle" letter-spacing="0" opacity="1">read</text>
<text x="72" y="412" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="72" dy="0">Pure calculations and read-only queries.</tspan></text>
<text x="72" y="474" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1F8A70" text-anchor="start" letter-spacing="1.2" opacity="1">default</text>
<rect x="402" y="292" width="396" height="212" rx="16" fill="#F7E3E1" stroke="#B3453F" stroke-width="1.5" opacity="1"/>
<text x="426" y="330" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="17" font-weight="700" fill="#B3453F" text-anchor="start" letter-spacing="0" opacity="1">Denied by default</text>
<rect x="426" y="352" width="62" height="24" rx="12" fill="#F7E3E1" stroke="none" stroke-width="1.5" opacity="1"/><text x="457" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#B3453F" text-anchor="middle" letter-spacing="0" opacity="1">write</text>
<rect x="498" y="352" width="100" height="24" rx="12" fill="#F7E3E1" stroke="none" stroke-width="1.5" opacity="1"/><text x="548" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#B3453F" text-anchor="middle" letter-spacing="0" opacity="1">destructive</text>
<rect x="608" y="352" width="76" height="24" rx="12" fill="#F7E3E1" stroke="none" stroke-width="1.5" opacity="1"/><text x="646" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#B3453F" text-anchor="middle" letter-spacing="0" opacity="1">unknown</text>
<text x="426" y="412" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="426" dy="0">Blocked before the SDK is invoked.</tspan></text>
<text x="426" y="474" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="10.5" font-weight="700" fill="#B3453F" text-anchor="start" letter-spacing="1.2" opacity="1">fail closed</text>
<rect x="822" y="292" width="330" height="212" rx="16" fill="#ECE9FD" stroke="#7C6CF0" stroke-width="1.5" opacity="1"/>
<text x="846" y="330" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="17" font-weight="700" fill="#5B4CD6" text-anchor="start" letter-spacing="0" opacity="1">Explicit authorization</text>
<rect x="846" y="348" width="118" height="25" rx="12.5" fill="#FFFFFF" stroke="#7C6CF0" stroke-width="1.2" opacity="1"/><text x="905" y="364.525" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="11.5" font-weight="600" fill="#5B4CD6" text-anchor="middle" letter-spacing="0" opacity="1">--allow-effects</text>
<rect x="846" y="378" width="138" height="25" rx="12.5" fill="#FFFFFF" stroke="#7C6CF0" stroke-width="1.2" opacity="1"/><text x="915" y="394.525" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="11.5" font-weight="600" fill="#5B4CD6" text-anchor="middle" letter-spacing="0" opacity="1">--allow-operations</text>
<rect x="846" y="408" width="144" height="25" rx="12.5" fill="#FFFFFF" stroke="#7C6CF0" stroke-width="1.2" opacity="1"/><text x="918" y="424.525" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="11.5" font-weight="600" fill="#5B4CD6" text-anchor="middle" letter-spacing="0" opacity="1">--allow-destructive</text>
<text x="846" y="446" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="846" dy="0">MCP uses equivalent environment variables.</tspan><tspan x="846" dy="17">Destructive calls also need confirmation when</tspan><tspan x="846" dy="17">interactive.</tspan></text>
<text x="48" y="548" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" fill="#5C6576" text-anchor="start" letter-spacing="1.6" opacity="1">RUNTIME PROTECTIONS</text>
<rect x="48" y="568" width="1104" height="96" rx="16" fill="#0B1220" stroke="#0B1220" stroke-width="1.5" opacity="1"/>
<circle cx="77" cy="598" r="3.5" fill="#7C6CF0"/>
<text x="90" y="602" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">env: refs only</text>
<circle cx="415" cy="598" r="3.5" fill="#7C6CF0"/>
<text x="428" y="602" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">runtime secret resolution</text>
<circle cx="753" cy="598" r="3.5" fill="#7C6CF0"/>
<text x="766" y="602" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">error redaction</text>
<circle cx="77" cy="632" r="3.5" fill="#7C6CF0"/>
<text x="90" y="636" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">100 items / 1 MB caps</text>
<circle cx="415" cy="632" r="3.5" fill="#7C6CF0"/>
<text x="428" y="636" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">infinite-cursor guard</text>
<circle cx="753" cy="632" r="3.5" fill="#18B6D9"/>
<text x="766" y="636" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">no silent host fallback</text>
<text x="48" y="698" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">Trusted-local mode is not a sandbox. Container mode fails closed when Docker or Podman is unavailable.</text>
</svg>
