<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">副作用显式授权，执行严格有界</title>
<desc id="desc">安全图：静态审查绝不导入目标代码或执行安装脚本；pure 与 read 副作用默认允许，write、destructive 与 unknown 需要显式授权；运行时保护包括环境密钥引用、敏感信息脱敏、分页上限与容器故障闭锁。</desc>
<defs><marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18B6D9"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B1220"/></marker><marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BDB6A7"/></marker><marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C6CF0"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B3453F"/></marker></defs>
<rect width="1200" height="720" fill="#F7F5EF"/>
<text x="48" y="34" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#087F9C" text-anchor="start" letter-spacing="1.8" opacity="1">安全</text><text x="48" y="66" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="31" font-weight="700" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">副作用显式授权，执行严格有界</text><text x="48" y="94" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="15.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">共享运行时为生成的 MCP 服务与 CLI 应用同一套默认策略。</text><path d="M 48 112 L 1152 112" stroke="#D9D3C6" stroke-width="1" stroke-opacity="1" fill="none" opacity="1"/>
<rect x="48" y="140" width="1104" height="96" rx="16" fill="#FFFFFF" stroke="#D9D3C6" stroke-width="1.5" opacity="1"/>
<text x="72" y="170" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" fill="#087F9C" text-anchor="start" letter-spacing="1.6" opacity="1">静态审查</text>
<rect x="72" y="190" width="108" height="28" rx="14" fill="#DDF4F9" stroke="none" stroke-width="1.2" opacity="1"/><text x="126" y="208.2" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#087F9C" text-anchor="middle" letter-spacing="0" opacity="1">不导入目标代码</text>
<rect x="194" y="190" width="108" height="28" rx="14" fill="#DDF4F9" stroke="none" stroke-width="1.2" opacity="1"/><text x="248" y="208.2" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#087F9C" text-anchor="middle" letter-spacing="0" opacity="1">不执行安装脚本</text>
<rect x="316" y="190" width="96" height="28" rx="14" fill="#DDF4F9" stroke="none" stroke-width="1.2" opacity="1"/><text x="364" y="208.2" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#087F9C" text-anchor="middle" letter-spacing="0" opacity="1">有界归档解压</text>
<rect x="426" y="190" width="96" height="28" rx="14" fill="#DDF4F9" stroke="none" stroke-width="1.2" opacity="1"/><text x="474" y="208.2" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#087F9C" text-anchor="middle" letter-spacing="0" opacity="1">记录内容摘要</text>
<text x="48" y="274" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" fill="#5C6576" text-anchor="start" letter-spacing="1.6" opacity="1">副作用策略</text>
<rect x="48" y="292" width="330" height="212" rx="16" fill="#DDF2EA" stroke="#1F8A70" stroke-width="1.5" opacity="1"/>
<text x="72" y="330" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="17" font-weight="700" fill="#1F8A70" text-anchor="start" letter-spacing="0" opacity="1">默认允许</text>
<rect x="72" y="352" width="52" height="24" rx="12" fill="#DDF2EA" stroke="none" stroke-width="1.5" opacity="1"/><text x="98" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#1F8A70" text-anchor="middle" letter-spacing="0" opacity="1">pure</text>
<rect x="134" y="352" width="52" height="24" rx="12" fill="#DDF2EA" stroke="none" stroke-width="1.5" opacity="1"/><text x="160" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#1F8A70" text-anchor="middle" letter-spacing="0" opacity="1">read</text>
<text x="72" y="412" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="72" dy="0">纯计算与只读查询。</tspan></text>
<text x="72" y="474" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1F8A70" text-anchor="start" letter-spacing="1.2" opacity="1">默认</text>
<rect x="402" y="292" width="396" height="212" rx="16" fill="#F7E3E1" stroke="#B3453F" stroke-width="1.5" opacity="1"/>
<text x="426" y="330" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="17" font-weight="700" fill="#B3453F" text-anchor="start" letter-spacing="0" opacity="1">默认拒绝</text>
<rect x="426" y="352" width="62" height="24" rx="12" fill="#F7E3E1" stroke="none" stroke-width="1.5" opacity="1"/><text x="457" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#B3453F" text-anchor="middle" letter-spacing="0" opacity="1">write</text>
<rect x="498" y="352" width="100" height="24" rx="12" fill="#F7E3E1" stroke="none" stroke-width="1.5" opacity="1"/><text x="548" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#B3453F" text-anchor="middle" letter-spacing="0" opacity="1">destructive</text>
<rect x="608" y="352" width="76" height="24" rx="12" fill="#F7E3E1" stroke="none" stroke-width="1.5" opacity="1"/><text x="646" y="368" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="650" fill="#B3453F" text-anchor="middle" letter-spacing="0" opacity="1">unknown</text>
<text x="426" y="412" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="426" dy="0">在调用 SDK 之前拦截。</tspan></text>
<text x="426" y="474" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="10.5" font-weight="700" fill="#B3453F" text-anchor="start" letter-spacing="1.2" opacity="1">故障闭锁</text>
<rect x="822" y="292" width="330" height="212" rx="16" fill="#ECE9FD" stroke="#7C6CF0" stroke-width="1.5" opacity="1"/>
<text x="846" y="330" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="17" font-weight="700" fill="#5B4CD6" text-anchor="start" letter-spacing="0" opacity="1">显式授权</text>
<rect x="846" y="348" width="118" height="25" rx="12.5" fill="#FFFFFF" stroke="#7C6CF0" stroke-width="1.2" opacity="1"/><text x="905" y="364.525" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="11.5" font-weight="600" fill="#5B4CD6" text-anchor="middle" letter-spacing="0" opacity="1">--allow-effects</text>
<rect x="846" y="378" width="138" height="25" rx="12.5" fill="#FFFFFF" stroke="#7C6CF0" stroke-width="1.2" opacity="1"/><text x="915" y="394.525" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="11.5" font-weight="600" fill="#5B4CD6" text-anchor="middle" letter-spacing="0" opacity="1">--allow-operations</text>
<rect x="846" y="408" width="144" height="25" rx="12.5" fill="#FFFFFF" stroke="#7C6CF0" stroke-width="1.2" opacity="1"/><text x="918" y="424.525" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="11.5" font-weight="600" fill="#5B4CD6" text-anchor="middle" letter-spacing="0" opacity="1">--allow-destructive</text>
<text x="846" y="446" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="846" dy="0">MCP 使用等价环境变量。交互式环境中的破坏性调用还</tspan><tspan x="846" dy="17">需要确认。</tspan></text>
<text x="48" y="548" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" fill="#5C6576" text-anchor="start" letter-spacing="1.6" opacity="1">运行时保护</text>
<rect x="48" y="568" width="1104" height="96" rx="16" fill="#0B1220" stroke="#0B1220" stroke-width="1.5" opacity="1"/>
<circle cx="77" cy="598" r="3.5" fill="#7C6CF0"/>
<text x="90" y="602" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">仅保存 env: 引用</text>
<circle cx="415" cy="598" r="3.5" fill="#7C6CF0"/>
<text x="428" y="602" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">运行时解析密钥</text>
<circle cx="753" cy="598" r="3.5" fill="#7C6CF0"/>
<text x="766" y="602" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">错误信息脱敏</text>
<circle cx="77" cy="632" r="3.5" fill="#7C6CF0"/>
<text x="90" y="636" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">100 条 / 1 MB 上限</text>
<circle cx="415" cy="632" r="3.5" fill="#7C6CF0"/>
<text x="428" y="636" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">无限游标防护</text>
<circle cx="753" cy="632" r="3.5" fill="#18B6D9"/>
<text x="766" y="636" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#F7F5EF" text-anchor="start" letter-spacing="0" opacity="1">绝不静默回退宿主执行</text>
<text x="48" y="698" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">本地受信模式不是沙箱。容器模式在 Docker 或 Podman 缺失时故障闭锁。</text>
</svg>
