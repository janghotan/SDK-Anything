<text x="600" y="292" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="middle" letter-spacing="0" opacity="1">reviewable evidence</text>
