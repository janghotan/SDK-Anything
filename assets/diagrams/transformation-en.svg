<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From SDK surface to atomic capabilities</title>
<desc id="desc">Before-and-after diagram: an ordinary TypeScript SDK client becomes atomic operations with typed inputs and explicit read, write, or destructive effect labels; diagnostics and overrides recover unresolved types.</desc>
<defs><marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18B6D9"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B1220"/></marker><marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BDB6A7"/></marker><marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C6CF0"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B3453F"/></marker></defs>
<rect width="1200" height="760" fill="#F7F5EF"/>
<text x="48" y="34" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#087F9C" text-anchor="start" letter-spacing="1.8" opacity="1">TRANSFORMATION</text><text x="48" y="66" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="31" font-weight="700" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">From SDK surface to atomic capabilities</text><text x="48" y="94" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="15.5" font-weight="400" fill="#5C6576" text-anchor="start" letter-spacing="0" opacity="1">The goal is a reviewable tool surface, not a magic wrapper around every symbol.</text><path d="M 48 112 L 1152 112" stroke="#D9D3C6" stroke-width="1" stroke-opacity="1" fill="none" opacity="1"/>
<rect x="48" y="150" width="432" height="390" rx="18" fill="#FFFFFF" stroke="#D9D3C6" stroke-width="1.5" opacity="1"/>
<text x="72" y="184" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" font-weight="700" fill="#5C6576" text-anchor="start" letter-spacing="1.4" opacity="1">BEFORE · ORDINARY SDK</text>
<text x="72" y="220" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="24" font-weight="700" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">my-sdk</text>
