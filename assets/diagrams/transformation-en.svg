<text x="48" y="700" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="48" dy="0">Complex or unresolved types are surfaced as diagnostics. Overrides are the recovery path; conversion quality depends on the SDK's type surface.</tspan></text>
