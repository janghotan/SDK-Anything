<rect x="72" y="430" width="384" height="34" rx="8" fill="#EFEBE1" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="88" y="452" font-family="'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace" font-size="13" font-weight="600" fill="#0B1220" text-anchor="start" letter-spacing="0" opacity="1">remove()</text>
<text x="440" y="452" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5C6576" text-anchor="end" letter-spacing="0" opacity="1">client method</text>
<text x="72" y="488" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="72" dy="0">Types and JSDoc describe the API, but effects, secret</tspan><tspan x="72" dy="19">handling, and result bounds are not expressed as agent</tspan><tspan x="72" dy="19">policy.</tspan></text>
<path d="M 486 300 L 714 300" stroke="#18B6D9" stroke-width="3" stroke-opacity="1" fill="none" marker-end="url(#arrowCyan)"/>
