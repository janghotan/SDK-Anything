<text x="744" y="492" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5C6576" text-anchor="start"><tspan x="744" dy="0">Typed inputs, effect labels, env: references, and bounded</tspan><tspan x="744" dy="19">results are visible before an agent calls anything.</tspan></text>
